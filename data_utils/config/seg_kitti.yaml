SOLVER:
  gpu: 0,1,2,3
  run: train
  logdir: logs/log_MultiScan-GF # NOTE: MultiScan has 26 classes
  best_val: max:mIoU

  ckpt_num: 20
  max_epoch: 50
  test_every_epoch: 5
  log_per_iter: 10

  weight_decay: 5e-3
  type: adamw_attn

  lr: 2e-3
  lr_type: cos_warmup
  warmup_epoch: 5
  # milestones: (70, 140)
  dist_url: tcp://localhost:10002  # for distributed training

DATA:
  train:
    name: kitti

    # hextree building
    depth: 12
    full_depth: 3

    # data augmentations
    distort: True
    angle: (0, 0, 180)
    scale: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: True
    cutmix: 0.0        # no cutmix
    # no crop for kitti
    crop_ratio: 0.8    # random ratio of random cropping
    max_npt: -1    # max point number of random cropping
    # data loading
    has_label: True
    # location: dataset/kitti
    filelist: dataset/kitti/train_data.txt
    batch_size: 2 # for a single GPU, real batch size = GPU_num * batch_size
    shuffle: True
    num_workers: 1

  test:
    name: kitti

    # hextree building
    depth: 12
    full_depth: 3

    # data augmentations
    distort: False  # no data augmentation by default
    angle: (5, 5, 180)
    scale: 0.2
    flip: (0.5, 0.5, 0.0)
    uniform: False
    crop_ratio: 0.8
    max_npt:  -1
    cutmix: 0.0   # no cutmix

    # data loading
    has_label: True
    # location: dataset/kitti
    filelist: dataset/kitti/val_data.txt
    batch_size: 1
    shuffle: False
    num_workers: 1

MODEL:
  name: hexsegformer_toy
  feature: GF # G -> Position txyz (4 channels);
            # F -> Lidar Density (1 channel)
  channel: 5 
  nout: 26
  nempty: True
  interp: nearest
  depth: 12
  sync_bn: True
  find_unused_parameters: False
  # use_compile: True

LOSS:
  mask: 0
  num_class: 26
