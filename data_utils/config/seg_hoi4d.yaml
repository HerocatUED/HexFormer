SOLVER:
  gpu: 0,1,2,3
  run: train
  logdir: logs/log_debug 
  best_val: max:mIoU_part

  ckpt_num: 200
  max_epoch: 1
  test_every_epoch: 5
  log_per_iter: 5

  weight_decay: 0.05
  type: adamw_attn

  lr: 0.0025
  lr_type: step_warmup
  warmup_epoch: 10
  milestones: (200, 300)
  dist_url: tcp://localhost:10002  # for distributed training

DATA:
  train:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: True
    # angle: (5, 5, 180)
    angle: (0, 9, 0) # HOI4D
    scale: 0.2
    # jitter: 0.1       # no jitter
    flip: (0.5, 0.5, 0.0)
    uniform: True
    cutmix: 0.0        # no cutmix
    crop_ratio: 1    # random ratio of random cropping
    max_npt: 120000    # max point number of random cropping
    # data loading
    location: dataset/hoi4d
    filelist: dataset/hoi4d/frame8/train_data1.txt
    batch_size: 6 # for a single GPU, real batch size = GPU_num * batch_size
    shuffle: True
    num_workers: 3

  test:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: False  # no data augmentation by default
    angle: (5, 5, 180)
    scale: 0.2
    # jitter: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: False
    crop_ratio: 0.8
    max_npt:  -1
    cutmix: 0.0   # no cutmix

    # data loading
    location: dataset/hoi4d
    filelist: dataset/hoi4d/frame8/val_data1.txt
    batch_size: 4
    shuffle: False
    num_workers: 2

MODEL:
  name: hexsegformer_toy
  feature: R
  channel: 4
  nout: 49
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False
  # use_compile: True

LOSS:
  mask: 0
  num_class: 49
