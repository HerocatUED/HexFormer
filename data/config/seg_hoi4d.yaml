SOLVER:
  gpu: 0,1,2,3
  run: train
  logdir: logs/log_b8_f8_d9
  best_val: max:mIoU_part

  ckpt_num: 200
  max_epoch: 120
  test_every_epoch: 5
  log_per_iter: 5

  weight_decay: 0.05
  type: adamw_attn

  lr: 0.001
  lr_type: step_warmup
  warmup_epoch: 10
  milestones: (50, 80, 100)
  dist_url: tcp://localhost:10002  # for distributed training

DATA:
  train:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 2

    # data augmentations
    distort: False
    cutmix: 0.0   # no cutmix
    # data loading
    location: data
    filelist: data/config/train_data.txt
    batch_size: 8 # for a single GPU, real batch size = GPU_num * batch_size
    shuffle: True
    num_workers: 1

  test:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 2

    # data augmentations
    distort: False  # no data augmentation by default
    cutmix: 0.0   # no cutmix
    # data loading
    location: data
    filelist: data/config/val_data.txt
    batch_size: 4
    shuffle: False
    num_workers: 1

MODEL:
  name: hexsegformer_toy
  # N -> Normal (3 channels);
  # D -> Displacement (1 channel);
  # F -> Color (3 channels);
  # P -> Position (4 channels);
  feature: P
  channel: 4
  nout: 49
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False

LOSS:
  mask: 0
  num_class: 49
