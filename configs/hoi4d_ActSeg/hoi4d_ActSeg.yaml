SOLVER:
  gpu: 0,1,2,3
  run: train
  logdir: logs_test/log_3Dconv_4Dattention_CPE_RPE_d9_3blocks_huge
  best_val: max:accu

  ckpt_num: 10
  max_epoch: 100
  test_every_epoch: 1
  log_per_iter: 10

  weight_decay: 5e-3
  type: adamw_attn
  lr: 5e-4
  lr_min: 1e-6
  lr_type: cos
  # warmup_epoch: 5
  rand_seed: 13
  dist_url: tcp://localhost:10002 # for distributed training


DATA:
  train:
    name: hoi4d_ActSeg

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: True
    angle: (10, 10, 180) # HOI4D
    scale: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: True
    cutmix: 0.0        # no cutmix
    crop_ratio: 1    # random ratio of random cropping
    max_npt: -1    # max point number of random cropping
    # data loading
    has_label: True
    history: -1 # unused
    location: .
    filelist: configs/hoi4d_ActSeg/train_data.txt
    batch_size: 1 # for a single GPU, real batch size = GPU_num * batch_size
    shuffle: True
    num_workers: 1

  test:
    name: hoi4d_ActSeg

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: False  # no data augmentation by default
    angle: (5, 5, 180)
    scale: 0.2
    flip: (0.5, 0.5, 0.0)
    uniform: False
    crop_ratio: 0.8
    max_npt:  -1
    cutmix: 0.0   # no cutmix

    # data loading
    has_label: False
    history: -1 # unused
    location: .
    filelist: configs/hoi4d_ActSeg/test_data.txt
    batch_size: 1
    shuffle: False
    num_workers: 1

MODEL:
  name: hexformer_action
  feature: G
  channel: 4
  nout: 19
  nempty: True
  interp: nearest
  sync_bn: True
  find_unused_parameters: False
  use_compile: False

LOSS:
  mask: -1
  num_class: 19
  weighted: False
