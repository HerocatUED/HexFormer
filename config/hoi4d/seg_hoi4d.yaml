SOLVER:
  gpu: 0,1,2,3
  run: train
  logdir: logs/log_new
  best_val: max:mIoU_part

  ckpt_num: 20
  max_epoch: 50
  test_every_epoch: 1
  log_per_iter: 100

  weight_decay: 1e-4
  type: adamw_attn
  lr: 5e-3
  # lr_min: 1e-6
  lr_type: cos
  # warmup_epoch: 5
  rand_seed: 13
  dist_url: tcp://localhost:10002 # for distributed training


DATA:
  train:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: True
    # angle: (5, 5, 180)
    angle: (0, 9, 0) # HOI4D
    scale: 0.1
    flip: (0.5, 0.5, 0.0)
    uniform: True
    cutmix: 0.0        # no cutmix
    # no crop for hoi4d
    crop_ratio: 1    # random ratio of random cropping
    max_npt: -1    # max point number of random cropping
    # data loading
    has_label: True
    history: 2
    location: /mnt/sdc/wangx/HOI4D/HOI4D_dataset/seg_data_h5
    filelist: config/hoi4d/train_data.txt
    batch_size: 32 # for a single GPU, real batch size = GPU_num * batch_size
    shuffle: True
    num_workers: 0

  test:
    name: hoi4d

    # hextree building
    depth: 9
    full_depth: 3

    # data augmentations
    distort: False  # no data augmentation by default
    angle: (5, 5, 180)
    scale: 0.2
    flip: (0.5, 0.5, 0.0)
    uniform: False
    crop_ratio: 0.8
    max_npt:  -1
    cutmix: 0.0   # no cutmix

    # data loading
    has_label: True
    history: 2
    location: /mnt/sdc/wangx/HOI4D/HOI4D_dataset/seg_data_h5
    filelist: config/hoi4d/val_data.txt
    batch_size: 8
    shuffle: False
    num_workers: 0

MODEL:
  name: hexsegformer_toy
  feature: G
  channel: 4
  nout: 49
  nempty: True
  interp: nearest
  depth: 9
  sync_bn: True
  find_unused_parameters: False
  use_compile: False

LOSS:
  mask: -1
  num_class: 49
  weighted: False
